# CI for adbd: HMG-API's mod workflow (the "hmgapi" floor, build, adbd/test.sh, check-scripts,
# a package signed with a throwaway key), with the SDK hmgapi-sdk.json pins and NDK r21 for
# adbd/build.sh. adbd/test.sh checks the binary is the one HMG-API built (ADBD_MD5).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mod:
    # the HMG-API commit with mod.yml's ndk input (Open-HMG/HMG-API#129); @v1.0.3 from 1.0.3
    uses: Open-HMG/HMG-API/.github/workflows/mod.yml@10943767dba4f85bbc843c63454f20d5944ed69d
    with:
      ndk: "21.4.7075529"   # r21e: adbd/build.sh builds for API 19, which newer NDKs dropped
